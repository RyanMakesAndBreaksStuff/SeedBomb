name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: Run all test suites
    # ponytail: one Windows job runs every suite, because the WPF tests need Windows.
    # The other suites would run cheaper on Linux if Actions minutes ever matter.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        id: restore
        run: dotnet restore SeedBomb.slnx

      # Each suite runs even when an earlier one fails, so one run reports every result.
      - name: Core tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet run --project src/SeedBomb.Core.Tests/SeedBomb.Core.Tests.csproj -c Release --no-restore

      - name: Bulk tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet run --project src/SeedBomb.Bulk.Tests/SeedBomb.Bulk.Tests.csproj -c Release --no-restore

      - name: WPF tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet run --project src/SeedBomb.Wpf.Tests/SeedBomb.Wpf.Tests.csproj -c Release --no-restore

      - name: Integration tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet run --project tests/SeedBomb.Integration.Tests/SeedBomb.Integration.Tests.csproj -c Release --no-restore
