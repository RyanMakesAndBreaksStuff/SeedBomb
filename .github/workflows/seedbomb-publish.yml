name: SeedBomb Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: seedbomb-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PROJECT: src/SeedBomb.Wpf/SeedBomb.Wpf.csproj
  TEST_PROJECT: src/SeedBomb.Wpf.Tests/SeedBomb.Wpf.Tests.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  publish:
    name: Publish self-contained exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $raw = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:INPUT_VERSION }
          $raw = "$raw".Trim()
          if ([string]::IsNullOrWhiteSpace($raw)) {
            throw "Version is required."
          }
          $version = $raw
          if ($version.StartsWith("v") -or $version.StartsWith("V")) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch "^\d+\.\d+\.\d+") {
            throw "Version must look like 1.2.3 (got '$raw')."
          }
          $assemblyVersion = ($version -split "-", 2)[0]
          "VERSION=$version" >> $env:GITHUB_ENV
          "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "PRERELEASE=$($version.Contains('-'))" >> $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Test
        run: dotnet run --project ${{ env.TEST_PROJECT }} -c Release --no-restore

      - name: Publish self-contained single-file exe (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishProfile=GitHubRelease `
            -p:Version=$env:VERSION `
            -p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            -p:FileVersion=$env:ASSEMBLY_VERSION `
            -p:InformationalVersion=$env:VERSION `
            -o $env:PUBLISH_DIR/x64

      - name: Publish self-contained single-file exe (x86)
        run: |
          dotnet publish ${{ env.PROJECT }} `
            -c Release `
            -r win-x86 `
            --self-contained true `
            -p:PublishProfile=GitHubRelease-x86 `
            -p:Version=$env:VERSION `
            -p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            -p:FileVersion=$env:ASSEMBLY_VERSION `
            -p:InformationalVersion=$env:VERSION `
            -o $env:PUBLISH_DIR/x86

      - name: Verify exes
        run: |
          function Assert-Exe([string]$Dir) {
            $exe = Join-Path $Dir "SeedBomb.exe"
            if (-not (Test-Path $exe)) {
              Get-ChildItem $Dir | Format-Table Name, Length
              throw "SeedBomb.exe was not produced in $Dir."
            }
            $file = Get-Item $exe
            if ($file.Length -lt 1MB) {
              throw "$($file.FullName) is unexpectedly small ($($file.Length) bytes); self-contained publish likely failed."
            }
            Write-Host "Published $($file.FullName) ($([math]::Round($file.Length / 1MB, 1)) MB)"
          }
          Assert-Exe "$env:PUBLISH_DIR/x64"
          Assert-Exe "$env:PUBLISH_DIR/x86"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exeX64 = Join-Path $env:PUBLISH_DIR "x64/SeedBomb.exe"
          $exeX86 = Join-Path $env:PUBLISH_DIR "x86/SeedBomb-x86.exe"
          Copy-Item (Join-Path $env:PUBLISH_DIR "x86/SeedBomb.exe") $exeX86
          $ghArgs = @(
            "release", "create", $env:RELEASE_TAG, $exeX64, $exeX86,
            "--title", "SeedBomb $($env:VERSION)",
            "--generate-notes",
            "--target", $env:GITHUB_SHA
          )
          if ($env:PRERELEASE -eq "true") {
            $ghArgs += "--prerelease"
          }
          & gh @ghArgs
